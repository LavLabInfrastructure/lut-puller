{{- if and (not .Values.config.existingSecret) (.Values.config.inlineConfigs) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lut-puller.fullname" . }}-config
  labels:
    {{- include "lut-puller.labels" . | nindent 4 }}
type: Opaque
data:
{{- range $config := .Values.config.inlineConfigs }}
  {{ $config.name }}: {{ $config.data | b64enc }}
{{- end }}
{{- end }}
